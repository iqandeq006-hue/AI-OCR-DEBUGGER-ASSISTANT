<!DOCTYPE html>
<html>
<head>
  <title>AI Debugger</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* 🔥 SIGNATURE CANVAS */
    #signatureCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    /* 🌌 Container */
    .container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
    }

    /* 🔮 Orb */
    .orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #c4b5fd, #4c1d95);
      position: relative;
      cursor: pointer;
      z-index: 2;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #a78bfa, #7c3aed, transparent);
      animation: spin 3s linear infinite;
      filter: blur(10px);
      opacity: 0.9;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: inset 0 0 20px rgba(167,139,250,0.6);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 💎 Glass Panel */
    .panel {
      position: absolute;
      bottom: 95px;
      width: 320px;
      left: 50%;
      transform: translateX(-50%);
      max-height: 320px;
      overflow-y: auto;

      backdrop-filter: blur(25px);
      background: rgba(20, 20, 40, 0.55);

      border-radius: 20px;
      padding: 15px;
      color: white;

      display: none;
      flex-direction: column;

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.4),
        0 0 25px rgba(124,58,237,0.2);

      opacity: 0;
      transform: translate(-50%, 20px);
      transition: all 0.25s ease;
    }

    .panel.active {
      display: flex;
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #output {
      margin-bottom: 10px;
      font-size: 14px;
    }

    #buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 8px 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(124,58,237,0.4);
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 18px rgba(124,58,237,0.6);
    }

    button:active {
      transform: scale(0.96);
    }

    .panel::-webkit-scrollbar {
      width: 6px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(124,58,237,0.6);
      border-radius: 10px;
    }

  </style>
</head>

<body>

<!-- 🔥 SIGNATURE CANVAS -->
<canvas id="signatureCanvas"></canvas>

<div class="container">
  <div class="panel" id="panel">
    <div id="output">Waiting...</div>
    <div id="buttons"></div>
  </div>

  <div class="orb" id="orb"></div>
</div>

<script>
/* ===== SIGNATURE ANIMATION ===== */

const canvas = document.getElementById("signatureCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let trail = [];
let progress = 0;
let running = false;

function getPath(t) {
  const w = canvas.width;
  const h = canvas.height;
  const p = t * 4;

  if (p < 1) return { x: w/2 + (w/2 * p), y: h };
  if (p < 2) return { x: w, y: h - (h * (p-1)) };
  if (p < 3) return { x: w - (w * (p-2)), y: 0 };
  return { x: 0, y: (h * (p-3)) };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(trail[0].x, trail[0].y);

    for (let i = 1; i < trail.length; i++) {
      ctx.lineTo(trail[i].x, trail[i].y);
    }

    ctx.strokeStyle = "rgba(167,139,250,0.9)";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#7c3aed";

    ctx.stroke();
  }

  const pos = getPath(progress);
  trail.push({ x: pos.x, y: pos.y });

  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = "#c4b5fd";
  ctx.shadowBlur = 30;
  ctx.shadowColor = "#a78bfa";
  ctx.fill();

  progress += 0.006;

  if (progress >= 1) {
    canvas.style.opacity = 0;

    setTimeout(() => {
      canvas.style.display = "none";
      window.api.disableClick();
    }, 800);

    return;
  }

  requestAnimationFrame(draw);
}

function startSignature() {
  if (running) return;
  running = true;

  window.api.enableClick();
  progress = 0;
  trail = [];

  draw();
}

window.api.receiveBoot(() => {
  if (!sessionStorage.getItem("played")) {
    sessionStorage.setItem("played", "yes");
    startSignature();
  }
});

/* ===== ORIGINAL CODE ===== */

const output = document.getElementById("output");
const buttonsDiv = document.getElementById("buttons");
const orb = document.getElementById("orb");
const panel = document.getElementById("panel");

let isProcessing = false;

orb.onclick = () => panel.classList.toggle("active");

// 🔥 FIXED MOUSE HANDLING (NO GLITCH)

function enableUI() {
  window.api.enableClick();
}

function disableUI() {
  setTimeout(() => {
    if (!panel.matches(':hover') && !orb.matches(':hover')) {
      window.api.disableClick();
    }
  }, 100);
}

orb.addEventListener("mouseenter", enableUI);
panel.addEventListener("mouseenter", enableUI);

orb.addEventListener("mouseleave", disableUI);
panel.addEventListener("mouseleave", disableUI);
function showProcessing() {
  isProcessing = true;
  output.innerText = "⏳ Processing...";
  buttonsDiv.innerHTML = "";
}

function showResult(text) {
  isProcessing = false;
  panel.classList.add("active");

  output.innerHTML = `
    <div style="opacity:0.6;font-size:12px;">Result</div>
    <div style="background:rgba(124,58,237,0.15);padding:10px;border-radius:12px;">
      ${text}
    </div>
  `;
}

window.api.receive(async (msg) => {
  const { type, data } = msg;

  if (type === "text") showResult(data);

  if (type === "buttons" || type === "files") {
    isProcessing = false;
    buttonsDiv.innerHTML = "";

    data.forEach(label => {
      const btn = document.createElement("button");
      btn.innerText = label;

      btn.onclick = async () => {
        if (isProcessing) return;

        showProcessing();

        if (label === "Select Folder") {
          const folder = await window.api.selectFolder();
          if (!folder) {
            output.innerText = "No folder selected";
            return;
          }
          window.api.send({ data: folder });
          return;
        }

        window.api.send({ data: label });
      };

      buttonsDiv.appendChild(btn);
    });
  }

  if (type === "request_folder") {
    showProcessing();
    const folder = await window.api.selectFolder();
    window.api.send({ data: folder });
  }

  if (type === "error") {
    isProcessing = false;
    output.innerText = "❌ " + data;
  }
});
</script>

</body>
</html>
